apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
        - image: proxy-docker-registry-azure-devops-nexus-prod.apps.ocpcorp.vtal.intra/briceburg/ping-pong:0.1.0
          name: guestbook-ui
          ports:
            - containerPort: 7777
      imagePullSecrets:
        - name: proxy-nexus-secret
